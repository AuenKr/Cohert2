apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true # Only needed because it's not the default `false`
    editable: true # Only needed because it's not the default `false`

  - name: Tempo
    type: tempo
    url: http://tempo:3200
    uid: tempo # Keep the UID for stable linking
    jsonData:
      httpMethod: GET

  - name: Loki
    type: loki
    url: http://loki:3100
    editable: true # Only needed because it's not the default `false`
    jsonData:
      derivedFields:
        - name: TraceId
          urlDisplayLabel: Tempo
          url: 'http://localhost:3000/explore?left=["now-1h","now","Tempo",{"query":"$${__value.raw}"}]'
          matcherRegex: '"trace_id":"([a-fA-F0-9]+)"'

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    url: http://pyroscope:4040
    uid: pyroscope # Keep the UID for stable linking

